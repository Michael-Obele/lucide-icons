[package]
name = "lucide-icons"
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Michael Obele <michael@svelte-apps.me>"]
repository = "https://github.com/Michael-Obele/lucide-icons"
description = "Search and browse Lucide Icons directly in Zed with slash commands"

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.6.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }